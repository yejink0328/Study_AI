[project]
name = "ai-study"
version = "0.1.0"
description = "개인 AI 학습 기록"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "jupyterlab",
]

[dependency-groups]
dev = ["nbstripout", "ruff"]

